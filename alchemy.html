<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alchemy · Level Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0a0a0b;--panel:#141416;--panel2:#1b1b1e;--line:#2c2c31;--line2:#232327;--ink:#f4f1f3;--soft:#a7a0a5;--acc:#e89ab8;--acc2:#f6c9da;--sel:#2a1d23;--up:#7fd8a8;--down:#ff8f8f;--warn:#ffb26b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
a{color:var(--acc2)}a:hover{color:var(--acc)}
.app{max-width:1280px;margin:12px auto;border:1.5px solid var(--acc);border-radius:12px;background:var(--panel);overflow:clip}
@media (max-width:1310px){.app{margin:8px}}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;background:var(--sel);flex:none}
h1{margin:0;font:700 24px "Space Grotesk",Inter,sans-serif;color:var(--acc)}
h2{margin:0;font:600 22px "Space Grotesk",Inter,sans-serif}
h3{margin:0;font:600 18px "Space Grotesk",Inter,sans-serif}
.cross{color:var(--acc2);font-size:12px;text-decoration:none;border:1px solid var(--acc2);border-radius:999px;padding:3px 11px}
.meta{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--up)}
.dot.old{background:var(--warn)}.dot.none{background:var(--down)}
.fld{display:flex;gap:6px;align-items:center}
input,select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{font:500 13.5px Inter,sans-serif;padding:8px 14px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--panel2);color:var(--soft);cursor:pointer}
.tab[aria-selected=true]{border-color:var(--acc);background:var(--sel);color:var(--acc2)}
.page{padding:18px 20px 24px;background:var(--panel2)}
.sub{font-size:13px;color:var(--soft);margin:2px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 12px}
.chip{font:500 12.5px Inter,sans-serif;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--soft);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--acc);background:var(--sel);color:var(--acc2)}
.chips .r{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--soft)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--bg);min-width:240px}
.search input{border:0;background:none;outline:0;flex:1;padding:2px}
.box{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:700 11.5px Inter,sans-serif;letter-spacing:.06em;color:var(--acc);padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:#1d1a1c}
tr.open td{background:var(--sel)}
.pname{font-size:15px}.psub{font-size:12px;color:var(--soft)}
.badge{font:700 10.5px Inter,sans-serif;padding:1px 7px;border-radius:999px;border:1px solid;margin-left:8px;white-space:nowrap}
.ok{color:var(--up)}.lock{color:var(--warn)}.pvp{color:var(--acc2)}
.up{color:var(--up)}.down{color:var(--down)}.soft{color:var(--soft)}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:16px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
@media (max-width:760px){.detail{grid-template-columns:1fr}}
.lbl{font:700 11.5px Inter,sans-serif;letter-spacing:.06em;color:var(--acc);margin-bottom:4px}
.mrow{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:2px 0}
.note{font-size:12px;color:var(--soft);margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cards.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.cards,.cards.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards,.cards.three{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.first{border-color:var(--acc)}.card.jump{border-color:var(--warn)}
.big{font:700 24px "Space Grotesk",Inter,sans-serif;color:var(--acc2)}
.sec{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:24px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.callout{margin-top:14px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}
.callout b{color:var(--acc)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-top:14px}
.grid2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;margin-top:14px}
@media (max-width:900px){.grid2,.grid2b{grid-template-columns:1fr}}
.side{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px}
.side.hl{border-color:var(--acc);background:var(--sel)}
.bag{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:6px 10px;align-items:center;font-size:13.5px;max-height:320px;overflow:auto}
.verdict{font:700 11.5px Inter,sans-serif;padding:3px 10px;border-radius:999px;border:1px solid;white-space:nowrap}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{width:34px;height:34px;background:var(--panel2);color:var(--ink);border:0;font-size:16px;cursor:pointer}
.step span{width:42px;text-align:center;font-variant-numeric:tabular-nums}
.btn{font:600 13px Inter,sans-serif;padding:7px 12px;border-radius:8px;border:1px solid var(--acc);background:var(--sel);color:var(--acc2);cursor:pointer}
.btn.ghost{border-style:dashed;background:none;width:100%;margin-top:12px;padding:10px}
.ghostbtn{background:none;border:0;color:var(--soft);cursor:pointer;font:inherit;font-size:13px}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.tot div{border:1px solid var(--line);border-radius:8px;padding:10px}
.tot div.hl{border-color:var(--acc);background:var(--sel)}
.tot small{font-size:11.5px;color:var(--soft);display:block}
.tot b{font:700 20px "Space Grotesk",Inter,sans-serif}
.mats{display:grid;grid-template-columns:22px minmax(0,1fr) 50px 110px 90px;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px;align-items:center}
.mats.h{font:700 11px Inter,sans-serif;letter-spacing:.05em;color:var(--soft);border-bottom:1px solid var(--line)}
.mats.done{opacity:.45;text-decoration:line-through}
.waiting{border:1px dashed var(--warn);border-radius:10px;padding:14px;margin-bottom:14px;font-size:13.5px}
.waiting b{color:var(--warn)}
[hidden]{display:none!important}
</style></head><body>
<div class="app">
 <div class="top">
  <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f6c9da" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7 15h10"/></svg></div>
  <h1>Alchemy</h1>
  <a class="cross" href="index.html">← Level Guide</a>
  <div class="meta">
   <span id="freshness"><span class="dot none"></span>No prices yet</span>
   <label class="fld">My alchemy <input id="skill" type="number" min="1" max="300" style="width:62px"></label>
  </div>
 </div>
 <div class="tabs" role="tablist">
  <button class="tab" data-t="top" aria-selected="true">Top sellers</button>
  <button class="tab" data-t="profit" aria-selected="false">Profit board</button>
  <button class="tab" data-t="raw" aria-selected="false">Craft or sell raw</button>
  <button class="tab" data-t="shop" aria-selected="false">Shopping list</button>
 </div>
 <div class="page">
  <div id="waiting" class="waiting" hidden></div>
  <section data-p="top"></section>
  <section data-p="profit" hidden></section>
  <section data-p="raw" hidden></section>
  <section data-p="shop" hidden></section>
 </div>
</div>
<script src="alchemy.js"></script>
</body></html>
